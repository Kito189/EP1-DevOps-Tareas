name: Docker Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: self-hosted
    name: Construir Imagen Docker

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verificar Dockerfile existe
      shell: powershell
      run: |
        if (Test-Path "Dockerfile") {
          Write-Host "Dockerfile encontrado"
        } else {
          Write-Error "Dockerfile no encontrado"
          exit 1
        }

    - name: Verificar docker-compose.yml existe
      shell: powershell
      run: |
        if (Test-Path "docker-compose.yml") {
          Write-Host "docker-compose.yml encontrado"
        } else {
          Write-Error "docker-compose.yml no encontrado"
          exit 1
        }

    - name: Construir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ticket-service:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Inspeccionar imagen construida
      run: docker image inspect ticket-service:latest
