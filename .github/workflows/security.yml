name: Security Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  owasp:
    runs-on: ubuntu-latest
    name: OWASP - Escaneo de dependencias

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Escanear dependencias con OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'EP1-DevOps-Tareas'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 9
            --enableRetired

      - name: Subir reporte OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 7

  sonarcloud:
    runs-on: ubuntu-latest
    name: SonarCloud - Análisis de código

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y analizar con SonarCloud
        run: mvn -B verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
