name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: self-hosted
    name: Ejecutar Tests

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Validar pom.xml
      run: mvn -B validate

    - name: Compilar proyecto
      run: mvn -B compile

    - name: Ejecutar tests unitarios
      run: mvn -B test

    - name: Subir reportes de tests
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reportes-tests
        path: target/surefire-reports/
        retention-days: 7

  build:
    runs-on: self-hosted
    needs: test
    name: Construir Aplicación

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Construir con Maven
      run: mvn -B clean package -DskipTests

    - name: Subir artefacto JAR
      uses: actions/upload-artifact@v4
      with:
        name: ticket-service-jar
        path: target/*.jar
        retention-days: 7

  deploy:
    runs-on: self-hosted
    needs: build
    name: Despliegue Simulado (Docker Compose)

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Construir JAR para imagen Docker
      run: mvn -B clean package -DskipTests

    - name: Levantar servicios con Docker Compose
      run: docker compose up -d --build

    - name: Esperar que la base de datos esté lista
      shell: pwsh
      run: |
        Write-Host "Esperando que PostgreSQL esté saludable..."
        for ($i = 1; $i -le 12; $i++) {
          $status = docker compose ps --format json | python3 -c "import sys,json; data=[json.loads(l) for l in sys.stdin if l.strip()]; healthy=[s for s in data if 'db' in s.get('Name','') and s.get('Health','') == 'healthy']; print('ok' if healthy else 'wait')" 2>$null
          if ($status -eq "ok") {
            Write-Host "Base de datos lista."
            break
          }
          Write-Host "Intento $i/12 - esperando 5s..."
          Start-Sleep -Seconds 5
        }

    - name: Esperar que los servicios estén disponibles
      shell: pwsh
      run: |
        Write-Host "Esperando write-service (puerto 8081)..."
        for ($i = 1; $i -le 12; $i++) {
          try {
            $r = Invoke-WebRequest -Uri http://localhost:8081/actuator/health -UseBasicParsing -TimeoutSec 3
            Write-Host "Write service disponible."; break
          } catch {
            Write-Host "Intento $i/12 - esperando 5s..."
            Start-Sleep -Seconds 5
          }
        }
        Write-Host "Esperando read-service (puerto 8082)..."
        for ($i = 1; $i -le 12; $i++) {
          try {
            $r = Invoke-WebRequest -Uri http://localhost:8082/actuator/health -UseBasicParsing -TimeoutSec 3
            Write-Host "Read service disponible."; break
          } catch {
            Write-Host "Intento $i/12 - esperando 5s..."
            Start-Sleep -Seconds 5
          }
        }

    - name: Verificar estado de los contenedores
      run: docker compose ps

    - name: Verificar salud de los servicios
      shell: pwsh
      run: |
        Write-Host "=== Write Service Health ==="
        try { Invoke-WebRequest -Uri http://localhost:8081/actuator/health -UseBasicParsing | Select-Object -ExpandProperty Content } catch { Write-Host "Write service no responde" }
        Write-Host "=== Read Service Health ==="
        try { Invoke-WebRequest -Uri http://localhost:8082/actuator/health -UseBasicParsing | Select-Object -ExpandProperty Content } catch { Write-Host "Read service no responde" }

    - name: Mostrar logs del despliegue
      if: always()
      run: docker compose logs --tail=30

    - name: Detener servicios
      if: always()
      run: docker compose down -v
