version: '3.8'

networks:
  ticket-network:
    driver: bridge

volumes:
  postgres-data:

services:
  db:
    image: postgres:15-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      - "com.ticketservice.role=database"
      - "com.ticketservice.version=1.0"

  write-service:
    build: .
    container_name: ticket-write-container
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=write
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ticketdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticket-network
    restart: unless-stopped
    labels:
      - "com.ticketservice.role=write-api"
      - "com.ticketservice.version=1.0"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  read-service:
    build: .
    container_name: ticket-read-container
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=read
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ticketdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticket-network
    restart: unless-stopped
    labels:
      - "com.ticketservice.role=read-api"
      - "com.ticketservice.version=1.0"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
