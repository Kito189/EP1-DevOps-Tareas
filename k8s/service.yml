apiVersion: v1
kind: Service
metadata:
  name: ticket-write-service
  labels:
    app: ticket-write
    component: write-api
spec:
  selector:
    app: ticket-write
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: ticket-read-service
  labels:
    app: ticket-read
    component: read-api
spec:
  selector:
    app: ticket-read
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
    component: database
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
