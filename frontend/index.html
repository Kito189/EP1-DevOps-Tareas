<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Service v2 - Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 0.3rem;
    }

    header p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
    }

    .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.offline { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #334155;
    }

    .card h2 {
      font-size: 1rem;
      color: #38bdf8;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.3rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 0.7rem;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      resize: vertical;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input[type="checkbox"] {
      accent-color: #38bdf8;
      width: 16px;
      height: 16px;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-secondary { background: #334155; color: #e2e8f0; }

    .alert {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }

    .alert.success { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
    .alert.error   { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }

    /* Lista de tickets */
    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 420px;
      overflow-y: auto;
    }

    .ticket-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.85rem;
    }

    .ticket-item .ticket-id {
      font-size: 0.7rem;
      color: #64748b;
      margin-bottom: 0.3rem;
      font-family: monospace;
    }

    .ticket-item .ticket-desc {
      color: #e2e8f0;
      margin-bottom: 0.4rem;
    }

    .ticket-item .ticket-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .badge.ABIERTO    { background: #1e3a5f; color: #38bdf8; }
    .badge.CERRADO    { background: #14532d; color: #86efac; }
    .badge.EN_PROCESO { background: #422006; color: #fbbf24; }

    .ticket-date {
      font-size: 0.7rem;
      color: #64748b;
    }

    .empty {
      text-align: center;
      color: #475569;
      padding: 2rem 0;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      color: #38bdf8;
      padding: 1rem 0;
      font-size: 0.85rem;
    }

    /* Buscar por ID */
    .search-result {
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>🎫 Ticket Servicev2</h1>
  <p>Panel de control — Microservicio CQRS</p>
</header>

<div class="status-bar">
  <div class="status-item">
    <div class="dot" id="dot-write"></div>
    <span id="label-write">Write Service :8081 — verificando...</span>
  </div>
  <div class="status-item">
    <div class="dot" id="dot-read"></div>
    <span id="label-read">Read Service :8082 — verificando...</span>
  </div>
</div>

<div class="grid">

  <!-- CREAR TICKET -->
  <div class="card">
    <h2>✍️ Crear Ticket</h2>

    <label for="descripcion">Descripción del problema</label>
    <textarea id="descripcion" rows="4" placeholder="Ej: Revisar filtración en baño 204..."></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="consentimiento" />
      <label for="consentimiento" style="margin:0">Doy mi consentimiento</label>
    </div>

    <button class="btn-primary" onclick="crearTicket()">Crear Ticket</button>

    <div class="alert" id="alert-crear"></div>
  </div>

  <!-- BUSCAR POR ID -->
  <div class="card">
    <h2>🔍 Buscar Ticket por ID</h2>

    <label for="ticketId">ID del ticket</label>
    <input type="text" id="ticketId" placeholder="Ej: uuid-del-ticket..." />

    <button class="btn-secondary" onclick="buscarTicket()">Buscar</button>

    <div class="search-result" id="search-result"></div>
  </div>

  <!-- LISTA DE TICKETS -->
  <div class="card" style="grid-column: 1 / -1;">
    <h2 style="justify-content: space-between;">
      <span>📋 Todos los Tickets</span>
      <button class="btn-secondary" onclick="cargarTickets()" style="width:auto; padding: 0.3rem 0.8rem; font-size:0.75rem;">↻ Actualizar</button>
    </h2>

    <div class="ticket-list" id="ticket-list">
      <div class="loading">Cargando tickets...</div>
    </div>
  </div>

</div>

<script>
  const WRITE = 'http://localhost:8081';
  const READ  = 'http://localhost:8082';

  // ── Estado de servicios ──────────────────────────────────────
  async function checkStatus() {
    await Promise.all([
      checkService(WRITE + '/actuator/health', 'dot-write', 'label-write', 'Write Service :8081'),
      checkService(READ  + '/actuator/health', 'dot-read',  'label-read',  'Read Service :8082'),
    ]);
  }

  async function checkService(url, dotId, labelId, name) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
      const data = await res.json();
      const ok = data.status === 'UP';
      document.getElementById(dotId).className  = 'dot ' + (ok ? 'online' : 'offline');
      document.getElementById(labelId).textContent = name + ' — ' + (ok ? '✅ Online' : '⚠️ Degradado');
    } catch {
      document.getElementById(dotId).className  = 'dot offline';
      document.getElementById(labelId).textContent = name + ' — ❌ Offline';
    }
  }

  // ── Crear ticket ─────────────────────────────────────────────
  async function crearTicket() {
    const desc = document.getElementById('descripcion').value.trim();
    const cons = document.getElementById('consentimiento').checked;
    const alert = document.getElementById('alert-crear');

    if (!desc) return mostrarAlerta(alert, 'error', 'La descripción es obligatoria.');
    if (!cons) return mostrarAlerta(alert, 'error', 'Debes dar tu consentimiento.');

    try {
      const res = await fetch(WRITE + '/api/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ descripcion: desc, consentimiento: cons }),
      });

      if (!res.ok) throw new Error('Error ' + res.status);

      const ticket = await res.json();
      mostrarAlerta(alert, 'success', `✅ Ticket creado — ID: ${ticket.id}`);
      document.getElementById('descripcion').value = '';
      document.getElementById('consentimiento').checked = false;
      setTimeout(cargarTickets, 500);
    } catch (e) {
      mostrarAlerta(alert, 'error', '❌ No se pudo crear el ticket. ¿Está el write-service activo?');
    }
  }

  // ── Buscar ticket ─────────────────────────────────────────────
  async function buscarTicket() {
    const id = document.getElementById('ticketId').value.trim();
    const container = document.getElementById('search-result');

    if (!id) return;

    container.style.display = 'block';
    container.innerHTML = '<div class="loading">Buscando...</div>';

    try {
      const res = await fetch(READ + '/api/tickets/' + id);
      if (res.status === 404) throw new Error('No encontrado');
      if (!res.ok) throw new Error('Error ' + res.status);
      const t = await res.json();
      container.innerHTML = renderTicket(t);
    } catch (e) {
      container.innerHTML = `<div class="alert error" style="display:block; margin-top:0">❌ ${e.message === 'No encontrado' ? 'Ticket no encontrado' : 'Error al buscar'}</div>`;
    }
  }

  // ── Cargar todos los tickets ──────────────────────────────────
  async function cargarTickets() {
    const list = document.getElementById('ticket-list');
    list.innerHTML = '<div class="loading">Cargando...</div>';

    try {
      const res = await fetch(READ + '/api/tickets');
      if (!res.ok) throw new Error('Error ' + res.status);
      const tickets = await res.json();

      if (!tickets.length) {
        list.innerHTML = '<div class="empty">No hay tickets aún. ¡Crea el primero!</div>';
        return;
      }

      list.innerHTML = tickets
        .slice().reverse()
        .map(renderTicket)
        .join('');
    } catch {
      list.innerHTML = '<div class="empty">❌ No se pudo conectar al read-service.<br>¿Está corriendo docker compose?</div>';
    }
  }

  // ── Helpers ───────────────────────────────────────────────────
  function renderTicket(t) {
    const fecha = t.fechaCreacion
      ? new Date(t.fechaCreacion).toLocaleString('es-CL')
      : '—';
    return `
      <div class="ticket-item">
        <div class="ticket-id">${t.id}</div>
        <div class="ticket-desc">${t.descripcion}</div>
        <div class="ticket-meta">
          <span class="badge ${t.estado}">${t.estado}</span>
          <span class="ticket-date">${fecha}</span>
        </div>
      </div>`;
  }

  function mostrarAlerta(el, tipo, msg) {
    el.className = 'alert ' + tipo;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  // ── Init ──────────────────────────────────────────────────────
  checkStatus();
  cargarTickets();
  setInterval(checkStatus, 15000);
</script>

</body>
</html>
